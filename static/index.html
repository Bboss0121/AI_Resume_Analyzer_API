<!DOCTYPE html>
<html lang ="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Resume Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; margin: 8px 0; }
    button { padding: 8px 16px; cursor: pointer; }
    .error { color: #b00020; }
    .score { font-size: 32px; font-weight: bold; }
  </style>
</head>
<body>
   <h1>AI Resume Analyzer</h1>

  <label>Resume (PDF)</label><br>
  <input type="file" id="resume" accept=".pdf"><br><br>

  <label>Job description</label>
  <textarea id="job" placeholder="Paste the job description here"></textarea><br>

  <button id="analyze">Analyze</button>

  <div id="result"></div>

  <script>
    const button = document.getElementById("analyze");
    const result = document.getElementById("result");

    function showList(title, items) {
      const h = document.createElement("h3");
      h.textContent = title + " (" + items.length + ")";
      result.appendChild(h);
      const p = document.createElement("p");
      p.textContent = items.length ? items.join(", ") : "None";
      result.appendChild(p);
    }

    button.addEventListener("click", async () => {
      result.innerHTML = "";
      const file = document.getElementById("resume").files[0];
      const job = document.getElementById("job").value.trim();

      if (!file) { result.innerHTML = '<p class="error">Please choose a PDF.</p>'; return; }
      if (!job) { result.innerHTML = '<p class="error">Please paste a job description.</p>'; return; }

      const formData = new FormData();
      formData.append("resume", file);            // must match the endpoint parameter
      formData.append("job_description", job);    // must match the endpoint parameter

      button.disabled = true;
      button.textContent = "Analyzing...";

      try {
        const res = await fetch("/analyze", { method: "POST", body: formData });
        const data = await res.json();

        if (!res.ok) {
          const msg = typeof data.detail === "string" ? data.detail : "Something went wrong.";
          result.innerHTML = '<p class="error">' + msg +'</p>';
          result.firstChild.textContent = msg;
          return;
        }

        const score = document.createElement("div");
        score.className = "score";
        score.textContent = "Match score: " + data.score + "%";
        result.appendChild(score);

        showList("Matched skills", data.matched);
        showList("Missing skills", data.missing);
        showList("Extra skills", data.extra);
      } catch (err) {
        result.innerHTML = '<p class="error">Could not reach the server. Is it running?</p>';
      } finally {
        button.disabled = false;
        button.textContent = "Analyze";
      }
    });
  </script>
</body>
</html>
